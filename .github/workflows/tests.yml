name: quality-and-tests

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Black check
        run: |
          python -m black --check run_benchmark.py main.py shopping_agent/evaluation tests/test_benchmark.py tests/test_metrics.py

      - name: Ruff check
        run: |
          python -m ruff check run_benchmark.py main.py shopping_agent/evaluation tests/test_benchmark.py tests/test_metrics.py

      - name: Mypy check
        run: |
          python -m mypy

  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: |
          pytest --cov=shopping_agent --cov=run_benchmark --cov-report=term-missing

  benchmark-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run baseline benchmark smoke
        run: |
          python run_benchmark.py --baseline-suite --save --verbose 0

      - name: Verify benchmark artifacts
        run: |
          test -f logs/baseline_suite.json
          test -f logs/baseline_suite.md
          test -f logs/main_results.md
          test -f logs/task_distribution.md

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build package
        run: |
          python -m build
