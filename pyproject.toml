[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shop-plan"
version = "0.1.0"
description = "Constraint-aware shopping agent with benchmark and RL scaffolding."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=0.40.0",
  "numpy>=1.24.0",
]

[project.scripts]
shop-plan = "main:main"
shop-plan-benchmark = "run_benchmark:main"

[project.optional-dependencies]
retrieval = [
  "scikit-learn>=1.4.0",
]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "scikit-learn>=1.4.0",
  "black>=23.11.0",
  "ruff>=0.6.0",
  "mypy>=1.8.0",
  "build>=1.2.0",
]

[tool.setuptools.packages.find]
include = ["shopping_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.10"
files = ["run_benchmark.py"]
ignore_missing_imports = true
follow_imports = "skip"
warn_unused_ignores = true
pretty = true

[tool.coverage.run]
branch = true
source = ["shopping_agent"]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 70
